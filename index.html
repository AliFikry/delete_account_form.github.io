<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #111827;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #dc2626;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #b91c1c;
        }

        p.note {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Delete Your Account</h1>

        <form id="deleteForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Delete Account</button>
        </form>

        <p class="note">⚠️ Once requested, your account and data will be permanently deleted after 90 days.</p>
    </div>

    <script>
        document.getElementById("deleteForm").addEventListener("submit", function (e) {
            e.preventDefault(); // prevent form reload

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("⚠️ Please fill in all fields before deleting.");
                return;
            }

            const confirmDelete = confirm("🚨 Are you sure?\nYour account will be deleted in 90 days.");
            if (confirmDelete) {
                alert("✅ Your deletion request has been submitted.\nYour account will be removed in 90 days.");
                this.reset(); // clear fields
            }
        });
    </script>
</body>

</html>
